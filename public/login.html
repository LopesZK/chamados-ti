<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso · HelpDesk TI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 430px;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .auth-header h1 {
      font-size: 1.5rem;
      margin: 0.5rem 0 0.25rem;
    }
    .auth-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .auth-tabs button {
      flex: 1;
    }
    .auth-error {
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
    }
    .divider {
      text-align: center;
      margin: 1.25rem 0;
      font-size: 0.8rem;
      opacity: 0.7;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <div class="card auth-card">
    <div class="auth-header">
      <span class="brand-text" style="font-size: 1.4rem;">HelpDesk<strong>TI</strong></span>
      <h1 id="auth-title">Entrar no Sistema</h1>
      <p class="subtitle">Autenticação segura com controle de perfis (RBAC)</p>
    </div>

    <div class="auth-tabs">
      <button type="button" id="tab-entrar" class="btn btn-primary">Entrar</button>
      <button type="button" id="tab-cadastrar" class="btn btn-secondary">Criar Conta</button>
    </div>

    <div id="auth-error" class="auth-error" role="alert"></div>

    <form id="auth-form">
      <div class="field hidden" id="campo-nome">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" placeholder="Ex: João Silva">
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com">
      </div>

      <div class="field">
        <label for="senha">Senha (mínimo 6 caracteres)</label>
        <input type="password" id="senha" required placeholder="••••••">
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary btn-block" style="margin-top: 0.5rem;">
        Entrar com E-mail e Senha
      </button>
    </form>

    <div class="divider">ou acesse rapidamente</div>

    <button type="button" id="btn-google" class="btn btn-secondary btn-block">
      Continuar com Google
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCVsTXQLhPZMWFs2UaQ_f-lO9FAjF_VrVk",
      authDomain: "chamados-ti-rbac-571a2.firebaseapp.com",
      projectId: "chamados-ti-rbac-571a2",
      storageBucket: "chamados-ti-rbac-571a2.firebasestorage.app",
      messagingSenderId: "1052412916427",
      appId: "1:1052412916427:web:ddf6771b839c9d5c92a14e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let modoCadastro = false;
    const errorBox = document.getElementById("auth-error");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "/";
      }
    });

    function exibirErro(codigo) {
      const mapa = {
        "auth/invalid-credential": "E-mail ou senha inválidos.",
        "auth/user-not-found": "Usuário não encontrado.",
        "auth/wrong-password": "Senha incorreta.",
        "auth/email-already-in-use": "Este e-mail já está cadastrado.",
        "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
        "auth/invalid-email": "Digite um e-mail válido.",
        "auth/popup-closed-by-user": "O pop-up do Google foi fechado antes de concluir o login.",
        "auth/unauthorized-domain": "Domínio não autorizado no Firebase Authentication."
      };
      errorBox.textContent = mapa[codigo] || `Erro: ${codigo}`;
      errorBox.style.display = "block";
    }

    async function salvarPerfilInicial(user, nomeInformado = "") {
      const ref = doc(db, "usuarios", user.uid);
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          uid: user.uid,
          nome: nomeInformado || user.displayName || user.email.split("@")[0],
          email: user.email,
          perfil: "user"
        });
      }
    }

    document.getElementById("tab-entrar").addEventListener("click", () => {
      modoCadastro = false;
      errorBox.style.display = "none";
      document.getElementById("campo-nome").classList.add("hidden");
      document.getElementById("auth-title").textContent = "Entrar no Sistema";
      document.getElementById("btn-submit").textContent = "Entrar com E-mail e Senha";
      document.getElementById("tab-entrar").className = "btn btn-primary";
      document.getElementById("tab-cadastrar").className = "btn btn-secondary";
    });

    document.getElementById("tab-cadastrar").addEventListener("click", () => {
      modoCadastro = true;
      errorBox.style.display = "none";
      document.getElementById("campo-nome").classList.remove("hidden");
      document.getElementById("auth-title").textContent = "Criar Nova Conta";
      document.getElementById("btn-submit").textContent = "Cadastrar e Entrar";
      document.getElementById("tab-cadastrar").className = "btn btn-primary";
      document.getElementById("tab-entrar").className = "btn btn-secondary";
    });

    document.getElementById("auth-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const nome = document.getElementById("nome").value.trim();

      try {
        if (modoCadastro) {
          if (!nome) {
            errorBox.textContent = "Informe seu nome completo para criar a conta.";
            errorBox.style.display = "block";
            return;
          }
          const cred = await createUserWithEmailAndPassword(auth, email, senha);
          await updateProfile(cred.user, { displayName: nome });
          await salvarPerfilInicial(cred.user, nome);
        } else {
          const cred = await signInWithEmailAndPassword(auth, email, senha);
          await salvarPerfilInicial(cred.user);
        }
        window.location.href = "/";
      } catch (err) {
        exibirErro(err.code);
      }
    });

    document.getElementById("btn-google").addEventListener("click", async () => {
      errorBox.style.display = "none";
      try {
        const provider = new GoogleAuthProvider();
        const cred = await signInWithPopup(auth, provider);
        await salvarPerfilInicial(cred.user);
        window.location.href = "/";
      } catch (err) {
        exibirErro(err.code);
      }
    });
  </script>
</body>
</html>
